name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC — dogfoods the full e2e without slowing every push
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:presets
      - run: npm run build

  # The full k3d e2e is slow (spins up a real cluster) — only run it on the
  # weekly schedule, manual dispatch, or when a PR is labeled "e2e", not on
  # every push. Dogfoods simgpu-e2e-reusable.yml, the same workflow other
  # repos reference directly (see ci-templates/README.md).
  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    uses: ./.github/workflows/simgpu-e2e-reusable.yml
    with:
      gpu-backend: simgpu
