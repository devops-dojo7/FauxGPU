name: Release images and chart

# Builds every component image for both linux/amd64 and linux/arm64 and
# publishes them, plus the Helm chart, to GHCR — so a fresh cluster (Intel/AMD
# or Apple Silicon/ARM node) can run:
#
#   helm install simgpu oci://ghcr.io/<owner>/fauxgpu/charts/fauxgpu --version X.Y.Z
#
# with no local `docker build` / `k3d image import` step. k3s/helm/simgpu/
# values.yaml's committed `image.registry`/`image.tag` already default to
# this same ghcr.io/<owner>/fauxgpu registry, so this workflow's own rewrite
# of those two lines (in its checkout only, never committed back) is mostly
# a version bump — it exists to guarantee the exact tag published for this
# run, even if someone forgot to update values.yaml's `image.tag` before
# tagging a release.
#
# Trigger: push a `vX.Y.Z` tag, or run manually via workflow_dispatch with a
# version input (handy for re-publishing without cutting a new tag).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0, no leading v)"
        required: true

env:
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/fauxgpu

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: device-plugin
            context: k3s/device-plugin
            dockerfile: k3s/device-plugin/Dockerfile
          - component: api
            context: .
            dockerfile: api/Dockerfile
          - component: trainer
            context: .
            dockerfile: k3s/trainer/Dockerfile
          - component: inference-server
            context: .
            dockerfile: k3s/inference-server/Dockerfile
          - component: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.component }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.component }}:latest

  publish-chart:
    needs: [version, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Point chart values at the images just published
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NS: ${{ env.IMAGE_NAMESPACE }}
        run: |
          set -euo pipefail
          CHART=k3s/helm/simgpu
          sed -i \
            -e "s|^version:.*|version: ${VERSION}|" \
            -e "s|^appVersion:.*|appVersion: \"${VERSION}\"|" \
            "$CHART/Chart.yaml"
          # values.yaml's `image.registry`/`image.tag` are the single source
          # every component's image resolves from (see templates/_helpers.tpl's
          # simgpu.image) — bumping just these two lines re-points the whole
          # published chart at this run's freshly-built images, matching
          # ghcr.io/${NS}/<component>:${VERSION} for every one of the five.
          sed -i \
            -e "s|^  registry: .*|  registry: ghcr.io/${NS}|" \
            -e "s|^  tag: .*|  tag: \"${VERSION}\"|" \
            "$CHART/values.yaml"

      - name: Package and push chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NS: ${{ env.IMAGE_NAMESPACE }}
        run: |
          set -euo pipefail
          helm package k3s/helm/simgpu --destination /tmp
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/fauxgpu-${VERSION}.tgz" "oci://ghcr.io/${NS}/charts"

      - uses: oras-project/setup-oras@v1

      - name: Publish Artifact Hub metadata
        env:
          NS: ${{ env.IMAGE_NAMESPACE }}
        # Lets https://artifacthub.io index oci://ghcr.io/<NS>/charts/fauxgpu
        # as Verified Publisher / support Ownership Claim — see
        # k3s/helm/simgpu/artifacthub-repo.yml and
        # https://artifacthub.io/docs/topics/repositories/helm-charts/#oci-support.
        # Re-pushed every release since the metadata tag isn't versioned;
        # harmless no-op when the file's content hasn't changed.
        run: |
          set -euo pipefail
          oras push \
            "ghcr.io/${NS}/charts/fauxgpu:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            k3s/helm/simgpu/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
