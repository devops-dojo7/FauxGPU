# Local dev stack: the simulator (api+web) plus its full observability
# stack (Prometheus + Grafana, provisioned with the existing k3s/grafana/
# dashboards; Langfuse, vendored from its own published compose in
# k3s/observability/langfuse/).
#
#   docker compose up                       # simulator only: api, web
#   docker compose --profile observability up   # + prometheus, grafana
#   docker compose --profile langfuse up         # + langfuse and its stack
#   docker compose --profile loadtest run k6     # scripts/load-test.js against api,
#                                                 #   results in Prometheus/Grafana
#                                                 #   (needs the observability profile up too)
#   docker compose --profile observability --profile langfuse up  # everything
#
# Ports: web :3000, api :8000, prometheus :9090, grafana :3001,
# langfuse :3002 (see k3s/observability/langfuse/docker-compose.langfuse.yml
# for why 3002/9092, not upstream's default 3000/9090).
include:
  - k3s/observability/langfuse/docker-compose.langfuse.yml

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      TRAINER_IMAGE: simgpu/trainer:dev
      SIMGPU_RESOURCE_NAME: simgpu.dev/gpu
      API_PORT: "8000"
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3002}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      AI_SETTINGS_SECRET: ${AI_SETTINGS_SECRET:-}
    volumes:
      - ai_settings_data:/data

  web:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./k3s/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # --web.enable-remote-write-receiver lets `k6 run -o experimental-prometheus-rw`
    # push load-test metrics straight in, alongside the scraped simgpu-api metrics.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    depends_on:
      - api

  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    volumes:
      - ./scripts/load-test.js:/scripts/load-test.js:ro
    environment:
      BASE_URL: http://api:8000
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
    command: run --out experimental-prometheus-rw /scripts/load-test.js
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./k3s/observability/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./k3s/observability/grafana-provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./k3s/observability/grafana-provisioning/dashboards/generated:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  ai_settings_data:
