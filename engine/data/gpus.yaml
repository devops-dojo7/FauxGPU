  # AMD's MI400 series, announced July 2026, disclosed in technical detail at
  # Hot Chips 2026. MI455X is the training/inference SKU (there's also an
  # MI430X HPC/FP64-heavy variant, not added here). Ships as part of AMD's
  # "Helios" rack-scale systems (AMD's NVL72-equivalent), but AMD disclosed
  # clean per-GPU figures at Hot Chips (not just rack aggregates), so this is
  # a legitimate single-GPU entry — same treatment as b200-sxm/rubin-sxm
  # above, which also ship inside multi-GPU systems but have real per-GPU specs.
  # vram_gb/mem_bandwidth_gbps/fp8_tflops/nvlink_gbps/l2_cache_mb are AMD's
  # own Hot Chips-disclosed per-GPU numbers (fp8_tflops converted from AMD's
  # stated 20.13 PFLOPS MXFP6/MXFP8 figure). AMD also disclosed 40.26 PFLOPS
  # MXFP4 — this table has no fp4 field, so it isn't recorded here. AMD's own
  # "315 TFLOPS FP16/FP32" figure is NOT used for bf16_tflops below: a 64x
  # jump from that to the FP8 matrix-engine figure implies it's plain
  # vector/SIMD throughput, not comparable to this table's tensor-core BF16
  # numbers elsewhere. bf16_tflops is instead derived from the FP8 figure
  # using this table's own MI325X entry's exact bf16:fp8 ratio (1307:2615 =
