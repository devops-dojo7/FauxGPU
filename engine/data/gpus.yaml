    vendor: NVIDIA
    name: H100 SXM5 80GB
    vram_gb: 80
    mem_bandwidth_gbps: 3350
    bf16_tflops: 989
    fp8_tflops: 1979
    nvlink_gbps: 900
    price_per_hr_usd: 4.5
    tdp_watts: 700
    idle_watts: 90
    architecture: Hopper
