  # third-party estimate (~2000-2500W liquid-cooled, unconfirmed by AMD);
  # idle_watts scales from it at mi325x's ~13% idle/TDP ratio, same
  # estimation tier. transistors_b/sm_count/core_count aren't recorded —
  # only a third-party "~320B transistors" figure was found, not confirmed
  # in AMD's own materials.
