# =============================================================================
# simgpu — single values.yaml for the whole fake-GPU K8s layer
# =============================================================================
# This file is the *only* thing most users need to edit. A plain
#   helm install simgpu oci://ghcr.io/devops-dojo7/fauxgpu/charts/simgpu
# pulls every component image straight from GHCR (see `image:` below) — no
# `docker build` / `k3d image import` step required. Override whatever you
# need with `-f my-values.yaml` or `--set key=value`; every knob in this repo
# lives under one of the top-level keys below, grouped by concern.
#
# Building from source instead? k3s/helm/simgpu/values-dev.yaml is a
# ready-made `-f` override pointing every component at local `docker build`
# tags (e.g. `simgpu/api:dev`) instead of the published GHCR images below.
# =============================================================================

# -----------------------------------------------------------------------------
# image: shared defaults every component's own image below inherits. Bump
# `tag` here to move the whole stack to a new release in one edit; only
# override an individual component's `image.<name>.repository`/`tag` if you
# need to point one piece somewhere else (e.g. a custom-built api image while
# everything else stays on the published release).
# -----------------------------------------------------------------------------
image:
  # GHCR namespace every component's repository is resolved under, unless a
  # component sets its own `repository` starting with a registry host (a
  # value containing "/" before the first "." — e.g. "simgpu/api:dev" for
  # local dev builds — is used as-is instead of being prefixed).
  registry: ghcr.io/devops-dojo7/fauxgpu
  # Shared tag for every component unless overridden per-component below.
  # Matches this chart's own Chart.yaml appVersion — the release pipeline
  # (.github/workflows/release.yml) keeps them in lockstep.
  tag: "0.2.4"
  pullPolicy: IfNotPresent

# =============================================================================
# GPU backend selection
# =============================================================================
# Which fake-GPU backend the cluster runs. "simgpu" is the lightweight
# built-in device-plugin below (default, matches the quick-start install).
# "fake-gpu-operator" targets github.com/run-ai/fake-gpu-operator, installed
# separately as a prerequisite (see README "Datacenter mode"); it must
# already be running in-cluster before you set this.
gpuBackend: simgpu

devicePlugin:
  image:
    repository: device-plugin
    # tag: ""       # falls back to image.tag above when unset
    # pullPolicy: "" # falls back to image.pullPolicy above when unset
  resourceName: simgpu.dev/gpu
  gpuModel: h100-sxm
  gpuCount: 8

# Only used when gpuBackend: fake-gpu-operator. resourceName must match
# whatever fake-gpu-operator's mock-NVML DaemonSet advertises in your
# cluster (its default is nvidia.com/gpu). nodePoolLabelKey/nodePool must
# match a pool defined under fake-gpu-operator's own `topology.nodePools`
# Helm values (set at *its* install time, not here) — see README
# "Datacenter mode" for the exact prerequisite install command.
fakeGpuOperator:
  resourceName: nvidia.com/gpu
  nodePoolLabelKey: run.ai/simulated-gpu-node-pool
  nodePool: default

  # fake-gpu-operator's own status-exporter already writes
  # nvidia.com/gpu.present/product/memory/count (verified against its
  # source — see internal/status-exporter/export/labels/labels_builder.go).
  # It does NOT write the rest of the real NVIDIA GPU Operator/Node
  # Feature Discovery label set — driver/CUDA version or GPU family/machine
  # — so a Kubernetes-native tool that reads those (e.g. a "gpuinfo"-style
  # TUI view) sees them as blank even though the core product/memory/count
  # info is already correct. This chart fills in the rest itself via a
  # post-install/upgrade Job (see fake-gpu-operator-labels-job.yaml) that
  # labels every node in `nodePool` above. Keep these in sync with whatever
  # GPU model you told fake-gpu-operator to simulate (its own
  # topology.nodePools.<pool>.gpuProduct, set at *its* install time) —
  # these defaults match this project's own playground-up.sh, which
  # simulates H100-SXM5-80GB.
  extraNodeLabels:
    enabled: true
    driverVersion: "550.90.07"
    cudaVersion: "12.4"
    gpuFamily: "hopper"
    gpuMachine: "NVIDIA-DGX-H100"

  # Opt-in heterogeneous fleet: one entry per fake-gpu-operator node pool
  # (each a real topology.nodePools.<name> on *its* install, set separately
  # — see README "Datacenter mode"), each with its own extra NFD-style
  # labels. When non-empty, the labeler Job loops over these instead of the
  # single nodePool/extraNodeLabels pair above, so e.g. an "h100" pool's
  # nodes and an "a100" pool's nodes each end up with metadata matching
  # their own simulated model rather than one label set applied everywhere.
  # scripts/playground-up.sh sets this to a 3-node H100/A100/B200 fleet.
  # Leave empty (the default) for the single, all-same-model pool above.
  nodePools: []
  # nodePools:
  #   - name: h100
  #     driverVersion: "550.90.07"
  #     cudaVersion: "12.4"
  #     gpuFamily: "hopper"
  #     gpuMachine: "NVIDIA-DGX-H100"
  #   - name: a100
  #     driverVersion: "535.129.03"
  #     cudaVersion: "12.2"
  #     gpuFamily: "ampere"
  #     gpuMachine: "NVIDIA-DGX-A100"

# Opt-in large simulated fleet: renders plain KWOK-annotated Node objects
# (no real kubelet backs them) so `kubectl get nodes` shows datacenter
# scale. Requires gpuBackend: fake-gpu-operator, its kwok-gpu-device-plugin
# enabled, and the KWOK controller already installed in-cluster (see
# README). These nodes cannot run real pods — trainer/inference Jobs still
# only schedule onto the real node pool.
fleet:
  enabled: false
  numNodes: 100
  nodeCpu: "32"
  nodeMemory: 128Gi
  # Which fake-gpu-operator node pool the fleet's nodes join — same
  # external topology.nodePools.<name> dependency as fakeGpuOperator.nodePool
  # above. Empty (default) falls back to fakeGpuOperator.nodePool, which is
  # fine for the single-pool manual walkthrough in README, but silently
  # lands on fake-gpu-operator's own built-in "default" pool (Tesla-K80, 2
  # GPUs) if you're layering fleet.enabled on top of scripts/playground-up.sh's
  # heterogeneous h100/a100/b200 setup, which never configures "default" —
  # set this to one of those pool names (e.g. "h100") to get a coherent,
  # already-configured GPU model instead.
  nodePool: ""

# =============================================================================
# Core services
# =============================================================================
api:
  image:
    repository: api
  replicas: 1
  port: 8000
  # Requests size the scheduler's placement decision and (via autoscaling
  # below) the CPU-utilization percentage HPA computes against; limits cap
  # what a runaway pod can consume. This is a lightweight FastAPI service —
  # these are deliberately small defaults, not a real training/serving
  # workload's sizing.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Opt-in HorizontalPodAutoscaler for simgpu-api, scaling on CPU
  # utilization — the same metrics-server-backed mechanism
  # engine/autoscaling.py simulates for inference replicas, here applied to
  # the real Deployment. Requires a metrics-server in-cluster (already
  # bundled in k3d/k3s by default) and api.resources.requests.cpu set
  # above (HPA's percentage target is relative to that request).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

web:
  enabled: true
  image:
    repository: web
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

trainer:
  enabled: true
  image:
    repository: trainer
  modelPreset: llama2-7b
  gpuModel: h100-sxm
  topologyShape: nvlink_node
  gpusPerNode: 8
  numNodes: 1
  fabricId: infiniband-hdr
  precision: bf16
  tokensPerStep: 32768
  totalSteps: 50
  speedup: 200
  gpusRequested: 8
  # CPU/memory requests alongside the GPU resource limit already set below
  # (gpuResourceName: gpusRequested) — the trainer is a pure-Python
  # simulator (no real GPU compute), so these stay small regardless of how
  # many simulated GPUs it "requests".
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# The real long-running inference server (k3s/inference-server), launched
# on demand via POST /inference/launch-k8s-server rather than deployed
# standing up-front like trainer/web above.
inferenceServer:
  image:
    repository: inference-server

# Opt-in default-deny NetworkPolicy for the api/web Deployments — explicit
# allow rules matching the traffic this chart's own components actually
# need (web -> api, trainer Job -> api, the fake-gpu-operator-labels-job's
# apiserver access is unaffected since NetworkPolicy only governs pod
# network traffic, not apiserver calls). Off by default since it requires
# a NetworkPolicy-enforcing CNI — k3s's bundled Flannel enforces
# NetworkPolicy out of the box via its built-in kube-router controller, so
# this "just works" on the k3d quick-start cluster this README's Quick
# start targets; a from-scratch upstream Kubernetes cluster may need
# Calico/Cilium or another policy-enforcing CNI instead.
#
# Note: `kubectl port-forward` (this README's documented way to reach
# simgpu-api/simgpu-web) tunnels through the API server/kubelet, not the
# pod network — NetworkPolicy has no visibility into it and never blocks
# it, so turning this on doesn't break the port-forward workflow anywhere
# in this repo's docs.
networkPolicy:
  enabled: false

# =============================================================================
# Optional integrations — every block below is opt-in (enabled: false by
# default) and a no-op until you flip it on. Secrets (grafana.*, langfuse.*)
# should never be committed here — pass them at deploy time via
# `--set-string` or a separate, gitignored `-f secrets.yaml`.
# =============================================================================

# Optional Grafana Cloud integration — disabled by default. All values here
# are secrets; leave this file's defaults empty and pass real values at
# deploy time only, e.g.:
#   helm upgrade simgpu k3s/helm/simgpu \
#     --set grafana.enabled=true \
#     --set-string grafana.url=https://yourorg.grafana.net \
#     --set-string grafana.apiKey=glsa_... \
#     --set-string grafana.remoteWriteUrl=https://prometheus-prod-XX.../api/prom/push \
#     --set-string grafana.promUsername=123456 \
#     --set-string grafana.promToken=glc_...
# Never commit real values for these into values.yaml.
grafana:
  enabled: false
  url: ""
  apiKey: ""
  remoteWriteUrl: ""
  promUsername: ""
  promToken: ""

# In-cluster observability stack — a ServiceMonitor for simgpu-api plus
# ConfigMaps wrapping the two existing k3s/grafana/*.json dashboards for
# kube-prometheus-stack's Grafana sidecar to auto-discover. Requires
# kube-prometheus-stack already installed (prerequisite, same pattern as
# fake-gpu-operator/KWOK above) — see README "Observability stack".
observability:
  enabled: false
  prometheusServiceMonitor: true

# Optional Langfuse tracing of individual inference requests — disabled by
# default. Same secret-handling convention as grafana above: leave these
# blank and pass real values at deploy time only, e.g.:
#   helm upgrade simgpu k3s/helm/simgpu \
#     --set langfuse.enabled=true \
#     --set-string langfuse.publicKey=pk-lf-... \
#     --set-string langfuse.secretKey=sk-lf-...
# Never commit real values for these into values.yaml.
langfuse:
  enabled: false
  publicKey: ""
  secretKey: ""
  host: "https://cloud.langfuse.com"
