# Which fake-GPU backend the cluster runs. "simgpu" is the lightweight
# built-in device-plugin below (default, matches the k3d quickstart).
# "fake-gpu-operator" targets github.com/run-ai/fake-gpu-operator, installed
# separately as a prerequisite (see README "Datacenter mode"); it must
# already be running in-cluster before you set this.
gpuBackend: simgpu

devicePlugin:
  image: simgpu/device-plugin:dev
  imagePullPolicy: IfNotPresent
  resourceName: simgpu.dev/gpu
  gpuModel: h100-sxm
  gpuCount: 8

# Only used when gpuBackend: fake-gpu-operator. resourceName must match
# whatever fake-gpu-operator's mock-NVML DaemonSet advertises in your
# cluster (its default is nvidia.com/gpu). nodePoolLabelKey/nodePool must
# match a pool defined under fake-gpu-operator's own `topology.nodePools`
# Helm values (set at *its* install time, not here) — see README
# "Datacenter mode" for the exact prerequisite install command.
fakeGpuOperator:
  resourceName: nvidia.com/gpu
  nodePoolLabelKey: run.ai/simulated-gpu-node-pool
  nodePool: default

  # fake-gpu-operator's own status-exporter already writes
  # nvidia.com/gpu.present/product/memory/count (verified against its
  # source — see internal/status-exporter/export/labels/labels_builder.go).
  # It does NOT write the rest of the real NVIDIA GPU Operator/Node
  # Feature Discovery label set — driver/CUDA version or GPU family/machine
  # — so a Kubernetes-native tool that reads those (e.g. a "gpuinfo"-style
  # TUI view) sees them as blank even though the core product/memory/count
  # info is already correct. This chart fills in the rest itself via a
  # post-install/upgrade Job (see fake-gpu-operator-labels-job.yaml) that
  # labels every node in `nodePool` above. Keep these in sync with whatever
  # GPU model you told fake-gpu-operator to simulate (its own
  # topology.nodePools.<pool>.gpuProduct, set at *its* install time) —
  # these defaults match this project's own playground-up.sh, which
  # simulates H100-SXM5-80GB.
  extraNodeLabels:
    enabled: true
    driverVersion: "550.90.07"
    cudaVersion: "12.4"
    gpuFamily: "hopper"
    gpuMachine: "NVIDIA-DGX-H100"

  # Opt-in heterogeneous fleet: one entry per fake-gpu-operator node pool
  # (each a real topology.nodePools.<name> on *its* install, set separately
  # — see README "Datacenter mode"), each with its own extra NFD-style
  # labels. When non-empty, the labeler Job loops over these instead of the
  # single nodePool/extraNodeLabels pair above, so e.g. an "h100" pool's
  # nodes and an "a100" pool's nodes each end up with metadata matching
  # their own simulated model rather than one label set applied everywhere.
  # scripts/playground-up.sh sets this to a 3-node H100/A100/B200 fleet.
  # Leave empty (the default) for the single, all-same-model pool above.
  nodePools: []
  # nodePools:
  #   - name: h100
  #     driverVersion: "550.90.07"
  #     cudaVersion: "12.4"
  #     gpuFamily: "hopper"
  #     gpuMachine: "NVIDIA-DGX-H100"
  #   - name: a100
  #     driverVersion: "535.129.03"
  #     cudaVersion: "12.2"
  #     gpuFamily: "ampere"
  #     gpuMachine: "NVIDIA-DGX-A100"

# Opt-in large simulated fleet: renders plain KWOK-annotated Node objects
# (no real kubelet backs them) so `kubectl get nodes` shows datacenter
# scale. Requires gpuBackend: fake-gpu-operator, its kwok-gpu-device-plugin
# enabled, and the KWOK controller already installed in-cluster (see
# README). These nodes cannot run real pods — trainer/inference Jobs still
# only schedule onto the real node pool.
fleet:
  enabled: false
  numNodes: 100
  nodeCpu: "32"
  nodeMemory: 128Gi

api:
  image: simgpu/api:dev
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 8000

web:
  enabled: true
  image: simgpu/web:dev
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 3000

trainer:
  enabled: true
  image: simgpu/trainer:dev
  imagePullPolicy: IfNotPresent
  modelPreset: llama2-7b
  gpuModel: h100-sxm
  topologyShape: nvlink_node
  gpusPerNode: 8
  numNodes: 1
  fabricId: infiniband-hdr
  precision: bf16
  tokensPerStep: 32768
  totalSteps: 50
  speedup: 200
  gpusRequested: 8

# The real long-running inference server (k3s/inference-server), launched
# on demand via POST /inference/launch-k8s-server rather than deployed
# standing up-front like trainer/web above.
inferenceServer:
  image: simgpu/inference-server:dev

# Optional Grafana Cloud integration — disabled by default. All values here
# are secrets; leave this file's defaults empty and pass real values at
# deploy time only, e.g.:
#   helm upgrade simgpu k3s/helm/simgpu \
#     --set grafana.enabled=true \
#     --set-string grafana.url=https://yourorg.grafana.net \
#     --set-string grafana.apiKey=glsa_... \
#     --set-string grafana.remoteWriteUrl=https://prometheus-prod-XX.../api/prom/push \
#     --set-string grafana.promUsername=123456 \
#     --set-string grafana.promToken=glc_...
# Never commit real values for these into values.yaml.
grafana:
  enabled: false
  url: ""
  apiKey: ""
  remoteWriteUrl: ""
  promUsername: ""
  promToken: ""

# In-cluster observability stack — a ServiceMonitor for simgpu-api plus
# ConfigMaps wrapping the two existing k3s/grafana/*.json dashboards for
# kube-prometheus-stack's Grafana sidecar to auto-discover. Requires
# kube-prometheus-stack already installed (prerequisite, same pattern as
# fake-gpu-operator/KWOK above) — see README "Observability stack".
observability:
  enabled: false
  prometheusServiceMonitor: true

# Optional Langfuse tracing of individual inference requests — disabled by
# default. Same secret-handling convention as grafana above: leave these
# blank and pass real values at deploy time only, e.g.:
#   helm upgrade simgpu k3s/helm/simgpu \
#     --set langfuse.enabled=true \
#     --set-string langfuse.publicKey=pk-lf-... \
#     --set-string langfuse.secretKey=sk-lf-...
# Never commit real values for these into values.yaml.
langfuse:
  enabled: false
  publicKey: ""
  secretKey: ""
  host: "https://cloud.langfuse.com"
