apiVersion: apps/v1
kind: Deployment
metadata:
  name: simgpu-api
  labels:
    app: simgpu-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: simgpu-api
  template:
    metadata:
      labels:
        app: simgpu-api
    spec:
      serviceAccountName: simgpu-api
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          env:
            - name: TRAINER_IMAGE
              value: {{ .Values.trainer.image }}
            - name: INFERENCE_SERVER_IMAGE
              value: {{ .Values.inferenceServer.image }}
            - name: SIMGPU_RESOURCE_NAME
              value: {{ include "simgpu.gpuResourceName" . | trim | quote }}
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
          {{- if or .Values.grafana.enabled .Values.langfuse.enabled }}
          envFrom:
            {{- if .Values.grafana.enabled }}
            - secretRef:
                name: simgpu-grafana
            {{- end }}
            {{- if .Values.langfuse.enabled }}
            - secretRef:
                name: simgpu-langfuse
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: simgpu-api
spec:
  selector:
    app: simgpu-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
