apiVersion: apps/v1
kind: Deployment
metadata:
  name: simgpu-api
  labels:
    app: simgpu-api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  {{/*
  Omitted entirely when autoscaling.enabled: the HPA below owns replica
  count once it exists — setting this field here would fight it back to
  .Values.api.replicas on every `helm upgrade` (Deployment.spec.replicas
  is desired state Helm re-applies; HPA's own writes to it don't stick
  across a subsequent apply that still specifies the field).
  */}}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: simgpu-api
  template:
    metadata:
      labels:
        app: simgpu-api
    spec:
      serviceAccountName: simgpu-api
      containers:
        - name: api
          image: {{ include "simgpu.image" (dict "root" $ "component" .Values.api.image) }}
          imagePullPolicy: {{ include "simgpu.imagePullPolicy" (dict "root" $ "component" .Values.api.image) }}
          env:
            - name: TRAINER_IMAGE
              value: {{ include "simgpu.image" (dict "root" $ "component" .Values.trainer.image) | quote }}
            - name: INFERENCE_SERVER_IMAGE
              value: {{ include "simgpu.image" (dict "root" $ "component" .Values.inferenceServer.image) | quote }}
            - name: SIMGPU_RESOURCE_NAME
              value: {{ include "simgpu.gpuResourceName" . | trim | quote }}
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
          {{- if or .Values.grafana.enabled .Values.langfuse.enabled }}
          envFrom:
            {{- if .Values.grafana.enabled }}
            - secretRef:
                name: simgpu-grafana
            {{- end }}
            {{- if .Values.langfuse.enabled }}
            - secretRef:
                name: simgpu-langfuse
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: simgpu-api
spec:
  selector:
    app: simgpu-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simgpu-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simgpu-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

