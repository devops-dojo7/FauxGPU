{{- if eq .Values.gpuBackend "simgpu" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: simgpu-device-plugin
  labels:
    app: simgpu-device-plugin
spec:
  selector:
    matchLabels:
      app: simgpu-device-plugin
  template:
    metadata:
      labels:
        app: simgpu-device-plugin
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: device-plugin
          image: {{ .Values.devicePlugin.image }}
          imagePullPolicy: {{ .Values.devicePlugin.imagePullPolicy }}
          env:
            - name: SIMGPU_RESOURCE_NAME
              value: {{ .Values.devicePlugin.resourceName | quote }}
            - name: SIMGPU_MODEL
              value: {{ .Values.devicePlugin.gpuModel | quote }}
            - name: SIMGPU_COUNT
              value: {{ .Values.devicePlugin.gpuCount | quote }}
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
{{- end }}
