apiVersion: 1

providers:
  - name: simgpu
    type: file
    updateIntervalSeconds: 30
    options:
      # Points at the pre-resolved copies (${DS_PROMETHEUS} -> a fixed
      # datasource uid) generated by scripts/generate-provisioned-dashboards.sh
      # — see that script's header comment for why the vendored originals
      # in k3s/grafana/ can't be provisioned from a file directly.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
